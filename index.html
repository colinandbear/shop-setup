<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop Setup Wizard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1e7;--card:#fffdf8;--ink:#1f1d1a;--muted:#6f6a61;--line:#e4dccd;--acc:#2f6b5a;--acc2:#e46a4a;--soft:#e8f0ec}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 120px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:20px;letter-spacing:-.01em}
.lang{display:flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;padding:6px 12px;font:600 13px Inter;color:var(--ink);cursor:pointer}
.lang button.on{background:var(--ink);color:var(--bg)}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:4px 0 6px}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.stepinfo{font-size:13px;color:var(--muted);margin-bottom:14px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:20px 18px}
h1{font-family:"Bricolage Grotesque",sans-serif;font-size:28px;line-height:1.1;margin:0 0 6px;letter-spacing:-.02em}
.lead{color:var(--muted);margin:0 0 18px}
.q{margin:0 0 20px}
.q:last-child{margin-bottom:0}
.q label.t{display:block;font-weight:600;margin-bottom:4px}
.q .h{font-size:13px;color:var(--muted);margin:-2px 0 8px}
input[type=text],input[type=email],input[type=number],textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;font:16px Inter;background:#fff;color:var(--ink)}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--acc)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font:500 14px Inter;color:var(--ink);cursor:pointer}
.opt.on{background:var(--acc);border-color:var(--acc);color:#fff}
.intro p{margin:0 0 12px}
.pill{display:inline-block;background:var(--soft);color:var(--acc);font-weight:600;font-size:12px;padding:4px 10px;border-radius:999px;margin-bottom:10px}
nav{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:22px 16px 18px}
nav .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:14px;padding:15px;font:600 16px Inter;cursor:pointer}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.sec{background:transparent;border:1.5px solid var(--ink);color:var(--ink);flex:0 0 34%}
.btn.acc{background:var(--acc2);color:#fff}
.review h3{font-family:"Bricolage Grotesque",sans-serif;font-size:17px;margin:18px 0 6px}
.review dl{margin:0;font-size:14px}
.review dt{color:var(--muted);margin-top:8px}
.review dd{margin:0;font-weight:500;word-break:break-word}
.review .empty{color:var(--acc2);font-weight:500}
.edit{background:none;border:0;color:var(--acc);font:600 13px Inter;cursor:pointer;padding:0;margin-left:6px}
.out{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
.note{font-size:13px;color:var(--muted);margin-top:10px}
.reset{background:none;border:0;color:var(--muted);font:500 13px Inter;text-decoration:underline;cursor:pointer;margin-top:16px;padding:0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Shop Setup ✦</div>
    <div class="lang"><button data-l="en">EN</button><button data-l="tr">TR</button></div>
  </header>
  <div class="bar"><i id="bar"></i></div>
  <div class="stepinfo" id="stepinfo"></div>
  <div class="card" id="card"></div>
  <button class="reset" id="reset"></button>
</div>
<nav><div class="in" id="nav"></div></nav>
<div class="toast" id="toast"></div>

<script>
const T = {
  en:{step:"Step",of:"of",back:"Back",next:"Next",start:"Let's go",review:"Review",
      copy:"Copy answers",dl:"Download .txt",copied:"Copied — paste it to Nik",dlok:"Saved",dlno:"Download not available here — use Copy instead",
      notset:"not answered",edit:"Edit",reset:"Start over",resetq:"Tap again to clear everything",
      outT:"All done 🎉",outL:"Download the .txt (or copy it) and send it to Nik on WhatsApp. That's everything he needs to build your shop system.",
      outN:"Your answers are saved on this phone, so you can come back and change them."},
  tr:{step:"Adım",of:"/",back:"Geri",next:"İleri",start:"Başlayalım",review:"Kontrol et",
      copy:"Cevapları kopyala",dl:".txt indir",copied:"Kopyalandı — Nik'e yapıştır",dlok:"Kaydedildi",dlno:"Burada indirme yok — Kopyala'yı kullan",
      notset:"cevaplanmadı",edit:"Düzenle",reset:"Baştan başla",resetq:"Her şeyi silmek için tekrar dokun",
      outT:"Hepsi tamam 🎉",outL:".txt dosyasını indir (veya kopyala) ve WhatsApp'tan Nik'e gönder. Mağaza sistemini kurması için gereken her şey bu.",
      outN:"Cevapların bu telefonda kayıtlı, istediğin zaman dönüp değiştirebilirsin."}
};
const O = (en,tr)=>({en,tr});
const STEPS = [
 {id:"intro",intro:true,
  en:{t:"Let's set up your shop",l:"Answer a few questions about you and your shop idea. It takes about 10 minutes. There are no wrong answers, and you can skip anything you're not sure about.",p:"You'll get your own Etsy shop, run from your phone, with a system that does the heavy lifting."},
  tr:{t:"Mağazanı kuralım",l:"Kendin ve mağaza fikrin hakkında birkaç soruyu cevapla. Yaklaşık 10 dakika sürer. Yanlış cevap yok, emin olmadığın soruyu atlayabilirsin.",p:"Telefonundan yöneteceğin kendi Etsy mağazan olacak, işin ağır kısmını sistem yapacak."}},
 {id:"you",en:{t:"About you",l:"So the system fits your life."},tr:{t:"Seni tanıyalım",l:"Sistem hayatına uysun diye."},q:[
  {id:"name",type:"text",en:"Your name",tr:"Adın"},
  {id:"city",type:"text",en:"City / country",tr:"Şehir / ülke",ph:{en:"Istanbul, Türkiye",tr:"İstanbul, Türkiye"}},
  {id:"phone",type:"one",en:"Your phone",tr:"Telefonun",o:[O("iPhone","iPhone"),O("Android","Android")]},
  {id:"lang",type:"one",en:"Language for your panel and guides",tr:"Panel ve rehberler hangi dilde olsun?",o:[O("English","İngilizce"),O("Turkish","Türkçe"),O("Both","İkisi de")]},
  {id:"english",type:"one",en:"How comfortable are you reading English?",tr:"İngilizce okumada ne kadar rahatsın?",o:[O("Very","Çok"),O("Okay","İdare eder"),O("Not much","Pek değil")]},
  {id:"hours",type:"one",en:"Hours per week you can give it",tr:"Haftada ayırabileceğin saat",o:[O("1–3","1–3"),O("3–6","3–6"),O("6–10","6–10"),O("10+","10+")]},
  {id:"when",type:"multi",en:"When are you usually free?",tr:"Genelde ne zaman boşsun?",o:[O("Mornings","Sabah"),O("Lunch breaks","Öğle arası"),O("Evenings","Akşam"),O("Late night","Gece geç"),O("Weekends","Hafta sonu")]}
 ]},
 {id:"accounts",en:{t:"Accounts",l:"What you have already. No problem if it's all 'no'."},tr:{t:"Hesaplar",l:"Şu an neler var? Hepsi 'yok' olsa da sorun değil."},q:[
  {id:"email",type:"email",en:"Email you'll use for the shop",tr:"Mağaza için kullanacağın e-posta",h:{en:"The one you'll use for Etsy.",tr:"Etsy için kullanacağın e-posta."}},
  {id:"etsy",type:"one",en:"Etsy account?",tr:"Etsy hesabın var mı?",o:[O("Yes, with a shop","Evet, mağazam da var"),O("Yes, no shop yet","Evet, mağaza yok"),O("No","Yok")]},
  {id:"canva",type:"one",en:"Canva?",tr:"Canva?",o:[O("Free","Ücretsiz"),O("Pro","Pro"),O("Don't use it","Kullanmıyorum")]},
  {id:"bank",type:"one",en:"Bank account in your own name (Türkiye)?",tr:"Kendi adına banka hesabın var mı (Türkiye)?",h:{en:"Etsy pays out to this.",tr:"Etsy kazancını buraya gönderir."},o:[O("Yes","Evet"),O("No","Hayır")]},
  {id:"id",type:"one",en:"Photo ID ready for Etsy's check?",tr:"Etsy doğrulaması için kimliğin hazır mı?",o:[O("Yes","Evet"),O("No","Hayır")]}
 ]},
 {id:"shop",en:{t:"Your shop idea",l:"The fun part. Rough ideas are fine."},tr:{t:"Mağaza fikrin",l:"Eğlenceli kısım. Kabaca fikirler yeterli."},q:[
  {id:"sell",type:"multi",en:"What would you like to sell? (digital is best to start)",tr:"Ne satmak istersin? (başlangıç için dijital en iyisi)",
   h:{en:"Digital = no shipping, no stock, sells while you work.",tr:"Dijital = kargo yok, stok yok, sen çalışırken satar."},
   o:[O("Clipart / stickers","Clipart / sticker"),O("Printable wall art","Basılabilir duvar sanatı"),O("Planners / trackers","Planlayıcı / takip sayfaları"),O("Phone wallpapers","Telefon duvar kağıtları"),O("Invitations / cards","Davetiye / kartlar"),O("Colouring pages","Boyama sayfaları"),O("Templates (Canva etc.)","Şablonlar (Canva vb.)"),O("Not sure yet","Henüz emin değilim")]},
  {id:"style",type:"textarea",en:"What style or vibe do you like?",tr:"Hangi tarzı / havayı seversin?",ph:{en:"e.g. cute anime, dark gothic, Y2K, football, cats, Turkish patterns…",tr:"örn. sevimli anime, gotik, Y2K, futbol, kediler, Türk motifleri…"}},
  {id:"interests",type:"textarea",en:"Your interests and hobbies",tr:"İlgi alanların ve hobilerin",h:{en:"The best shops come from what you already love.",tr:"En iyi mağazalar zaten sevdiğin şeylerden çıkar."}},
  {id:"buyer",type:"text",en:"Who would buy it?",tr:"Kim satın alır?",ph:{en:"e.g. students, new mums, gamers, teachers",tr:"örn. öğrenciler, yeni anneler, oyuncular, öğretmenler"}},
  {id:"art",type:"one",en:"Can you draw or design?",tr:"Çizim ya da tasarım yapabilir misin?",o:[O("Yes, I draw","Evet, çizerim"),O("A bit","Biraz"),O("No — system makes the art","Hayır — çizimi sistem yapsın")]},
  {id:"shopName",type:"text",en:"Shop name ideas (if any)",tr:"Mağaza adı fikirlerin (varsa)"},
  {id:"loves",type:"textarea",en:"Any Etsy shops or accounts you love the look of?",tr:"Görünüşünü sevdiğin Etsy mağazaları veya hesaplar var mı?",ph:{en:"Links or names",tr:"Link veya isimler"}},
  {id:"avoid",type:"text",en:"Anything you DON'T want to do?",tr:"Kesinlikle yapmak İSTEMEDİĞİN bir şey var mı?"}
 ]},
 {id:"goals",en:{t:"Goals",l:"So we aim at the right target."},tr:{t:"Hedefler",l:"Doğru hedefe nişan alalım."},q:[
  {id:"income",type:"one",en:"Monthly income goal (first 6 months)",tr:"Aylık gelir hedefi (ilk 6 ay)",o:[O("Any sales at all","Herhangi bir satış"),O("£50–£150","£50–£150"),O("£150–£500","£150–£500"),O("£500+","£500+")]},
  {id:"launch",type:"one",en:"When do you want to launch?",tr:"Ne zaman açmak istersin?",o:[O("ASAP","Hemen"),O("Within a month","Bir ay içinde"),O("No rush","Acele yok")]},
  {id:"why",type:"textarea",en:"What would this money mean for you?",tr:"Bu para senin için ne ifade eder?",h:{en:"Optional — helps keep you motivated.",tr:"İsteğe bağlı — motivasyonu korumaya yardım eder."}}
 ]},
 {id:"social",en:{t:"Social media",l:"Optional — the system can make the posts for you."},tr:{t:"Sosyal medya",l:"İsteğe bağlı — paylaşımları sistem hazırlayabilir."},q:[
  {id:"socialWhen",type:"one",en:"Start social media…",tr:"Sosyal medyaya ne zaman başlayalım?",o:[O("From day one","İlk günden"),O("Later","Daha sonra"),O("Never","Hiç")]},
  {id:"platforms",type:"multi",en:"Which platforms?",tr:"Hangi platformlar?",o:[O("Instagram","Instagram"),O("Pinterest","Pinterest"),O("TikTok","TikTok")]},
  {id:"handles",type:"text",en:"Existing handles (if any)",tr:"Mevcut kullanıcı adların (varsa)"}
 ]},
 {id:"panel",en:{t:"Your panel",l:"The app on your home screen that runs it all."},tr:{t:"Panelin",l:"Ana ekranındaki, her şeyi yöneten uygulama."},q:[
  {id:"look",type:"one",en:"Panel look",tr:"Panel görünümü",o:[O("Dark","Koyu"),O("Light","Açık"),O("Colourful","Renkli")]},
  {id:"daily",type:"one",en:"Want a short daily summary?",tr:"Kısa bir günlük özet ister misin?",o:[O("Yes","Evet"),O("Weekly is enough","Haftalık yeter"),O("No","Hayır")]},
  {id:"panelWish",type:"textarea",en:"Anything you'd love the panel to do?",tr:"Panelin yapmasını istediğin bir şey var mı?"}
 ]},
 {id:"beta",en:{t:"The beta deal",l:"You use the system free. In return, help make it better."},tr:{t:"Beta anlaşması",l:"Sistemi ücretsiz kullanırsın. Karşılığında daha iyi olmasına yardım edersin."},q:[
  {id:"deal",type:"multi",en:"Tick what you're happy with",tr:"Uygun olanları işaretle",
   o:[O("Shop and earnings are mine","Mağaza ve kazanç benim"),O("System is free for me","Sistem benim için ücretsiz"),O("Nik owns the system — I won't copy or resell it","Sistem Nik'in — kopyalamam veya satmam"),O("I'll give honest feedback","Dürüst geri bildirim veririm"),O("Screen recordings when stuck","Takılınca ekran kaydı atarım"),O("Testimonial if it works","İşe yararsa yorum yazarım")]},
  {id:"feedback",type:"one",en:"Easiest way to give feedback",tr:"Geri bildirim için en kolay yol",o:[O("Voice notes","Sesli mesaj"),O("Text","Yazı"),O("Button in the panel","Paneldeki buton")]},
  {id:"extra",type:"textarea",en:"Anything else Nik should know?",tr:"Nik'in bilmesi gereken başka bir şey?"}
 ]},
 {id:"review",review:true,en:{t:"Check your answers"},tr:{t:"Cevaplarını kontrol et"}}
];

let L = "en", i = 0, A = {};
const KEY="shopWizard.v1";
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s){A=s.A||{};L=s.L||"en";i=Math.min(s.i||0,STEPS.length-1);}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({A,L,i}))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const t=k=>T[L][k];

function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("show");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("show"),2200)}

function render(){
  document.documentElement.lang=L;
  document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===L));
  const s=STEPS[i], c=$("#card");
  $("#bar").style.width=(i/(STEPS.length-1)*100)+"%";
  $("#stepinfo").textContent = (i>0 && !s.review) ? `${t("step")} ${i} ${t("of")} ${STEPS.length-2}` : "";
  $("#reset").textContent=t("reset");
  if(s.intro){
    c.innerHTML=`<div class="intro"><span class="pill">Beta ✦</span><h1>${s[L].t}</h1><p class="lead">${s[L].l}</p><p>${s[L].p}</p></div>`;
  } else if(s.review){
    c.innerHTML=reviewHTML();
    c.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{i=+b.dataset.go;save();render();scrollTo(0,0)});
  } else {
    c.innerHTML=`<h1>${s[L].t}</h1><p class="lead">${s[L].l}</p>`+s.q.map(qHTML).join("");
    bind(c,s);
  }
  navHTML();
}
function qHTML(q){
  const v=A[q.id], h=q.h?`<div class="h">${q.h[L]}</div>`:"";
  let f="";
  if(q.type==="one"||q.type==="multi"){
    f=`<div class="opts">`+q.o.map((o,k)=>{
      const on = q.type==="one" ? v===o.en : Array.isArray(v)&&v.includes(o.en);
      return `<button type="button" class="opt${on?" on":""}" data-q="${q.id}" data-k="${k}">${esc(o[L])}</button>`}).join("")+`</div>`;
  } else if(q.type==="textarea"){
    f=`<textarea data-q="${q.id}" placeholder="${esc(q.ph?q.ph[L]:"")}">${esc(v||"")}</textarea>`;
  } else {
    f=`<input type="${q.type==="email"?"email":"text"}" data-q="${q.id}" value="${esc(v||"")}" placeholder="${esc(q.ph?q.ph[L]:"")}" autocomplete="off">`;
  }
  return `<div class="q"><label class="t">${esc(q[L])}</label>${h}${f}</div>`;
}
function bind(c,s){
  c.querySelectorAll("input,textarea").forEach(el=>el.oninput=()=>{A[el.dataset.q]=el.value;save()});
  c.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const q=s.q.find(x=>x.id===b.dataset.q), val=q.o[+b.dataset.k].en;
    if(q.type==="one"){A[q.id]=A[q.id]===val?"":val}
    else{const a=Array.isArray(A[q.id])?A[q.id]:[];A[q.id]=a.includes(val)?a.filter(x=>x!==val):[...a,val]}
    save();
    b.parentNode.querySelectorAll(".opt").forEach((x,k)=>{const ov=q.o[k].en;x.classList.toggle("on",q.type==="one"?A[q.id]===ov:A[q.id].includes(ov))});
  });
}
function show(q){
  const v=A[q.id];
  if(Array.isArray(v)) return v.length? v.map(x=>{const o=q.o.find(o=>o.en===x);return o?o[L]:x}).join(", "):"";
  if(q.o&&v){const o=q.o.find(o=>o.en===v);return o?o[L]:v}
  return v||"";
}
function reviewHTML(){
  let h=`<div class="review"><h1>${STEPS[i][L].t}</h1>`;
  STEPS.forEach((s,k)=>{ if(!s.q)return;
    h+=`<h3>${s[L].t}<button class="edit" data-go="${k}">${t("edit")}</button></h3><dl>`;
    s.q.forEach(q=>{const v=show(q);h+=`<dt>${esc(q[L])}</dt><dd>${v?esc(v):`<span class="empty">— ${t("notset")}</span>`}</dd>`});
    h+=`</dl>`;
  });
  h+=`<h3 style="margin-top:26px">${t("outT")}</h3><p class="lead" style="margin:0">${t("outL")}</p>
  <div class="out"><button class="btn acc" id="dl">${t("dl")}</button><button class="btn pri" id="cp">${t("copy")}</button></div>
  <p class="note">${t("outN")}</p></div>`;
  return h;
}
function exportText(){
  const d=new Date().toISOString().slice(0,10);
  let out=`SHOP SETUP ANSWERS\nName: ${(A.name||"").trim()||"(not answered)"}\nDate: ${d}\nFilled in using: ${L==="tr"?"Turkish":"English"}\n`;
  STEPS.forEach(s=>{ if(!s.q)return;
    out+=`\n== ${s.en.t.toUpperCase()} ==\n`;
    s.q.forEach(q=>{const v=A[q.id];const val=Array.isArray(v)?v.join(", "):(v||"");out+=`- ${q.en}: ${val.trim()?val.trim():"(not answered)"}\n`});
  });
  return out;
}
function navHTML(){
  const n=$("#nav"), s=STEPS[i];
  if(s.intro){n.innerHTML=`<button class="btn pri" id="nx">${t("start")}</button>`}
  else if(s.review){n.innerHTML=`<button class="btn sec" id="bk">${t("back")}</button>`}
  else{n.innerHTML=`<button class="btn sec" id="bk">${t("back")}</button><button class="btn pri" id="nx">${i===STEPS.length-2?t("review"):t("next")}</button>`}
  const nx=$("#nx"),bk=$("#bk");
  if(nx)nx.onclick=()=>{i++;save();render();scrollTo(0,0)};
  if(bk)bk.onclick=()=>{i--;save();render();scrollTo(0,0)};
  const cp=$("#cp"),dl=$("#dl");
  if(cp)cp.onclick=async()=>{try{await navigator.clipboard.writeText(exportText());toast(t("copied"))}catch(e){fallbackCopy()}};
  if(dl)dl.onclick=download;
}
function fallbackCopy(){
  const ta=document.createElement("textarea");ta.value=exportText();ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();
  try{document.execCommand("copy");toast(t("copied"))}catch(e){toast("—")} ta.remove();
}
let dlCap=null;
async function download(){
  const name=`shop-setup-${(A.name||"brief").toString().trim().toLowerCase().replace(/[^a-z0-9]+/g,"-")||"brief"}.txt`;
  const text=exportText();
  if(dlCap){
    try{await dlCap.save({filename:name,data:text});toast(t("dlok"));return}
    catch(e){try{await dlCap.save({filename:name,data:new Blob([text],{type:"text/plain"})});toast(t("dlok"));return}catch(e2){}}
  }
  // plain browser fallback (works when opened outside the Claude viewer)
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"text/plain"}));a.download=name;document.body.appendChild(a);a.click();a.remove();
      if(!window.claude)toast(t("dlok"));else toast(t("dlno"))}catch(e){toast(t("dlno"))}
}
if(window.claude&&window.claude.use){window.claude.use("downloads").then(d=>{dlCap=d}).catch(()=>{})}

document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{L=b.dataset.l;save();render()});
let armed=false;
$("#reset").onclick=()=>{ if(!armed){armed=true;toast(t("resetq"));setTimeout(()=>armed=false,3000);return}
  A={};i=0;armed=false;save();render();scrollTo(0,0)};
render();
</script>
</body>
</html>
